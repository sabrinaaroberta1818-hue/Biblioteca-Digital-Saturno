
name: Validacao do Projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Verificar codigo
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar sintaxe Python
        run: python -m compileall -q app.py

      - name: Verificar sintaxe JavaScript
        run: node --check js/app.js